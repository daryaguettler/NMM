<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280">
  <style>
    .grid { stroke: #b8b8b8; stroke-width: 0.5; fill: none; }
    .gridb { stroke: #555; stroke-width: 1; fill: none; }
    .stencil { fill: #4070a0; stroke: #2a4d7a; stroke-width: 1; }
    .center { fill: #c4322f; stroke: #882a28; stroke-width: 1; }
    .lbl { font-family: -apple-system, sans-serif; font-size: 11px; fill: #222; }
    .lblc { font-family: -apple-system, sans-serif; font-size: 11px; fill: #222; text-anchor: middle; }
    .eq { font-family: -apple-system, sans-serif; font-size: 11px; fill: #222; }
  </style>

  <!-- Title -->
  <text x="350" y="22" class="lblc" font-weight="600" font-size="13">5-point stencil on a structured grid</text>

  <!-- Grid -->
  <g transform="translate(60, 50)">
    <!-- Background grid -->
    <g class="grid">
      <line x1="0" y1="0" x2="320" y2="0"/>
      <line x1="0" y1="40" x2="320" y2="40"/>
      <line x1="0" y1="80" x2="320" y2="80"/>
      <line x1="0" y1="120" x2="320" y2="120"/>
      <line x1="0" y1="160" x2="320" y2="160"/>
      <line x1="0" y1="200" x2="320" y2="200"/>
      <line x1="0" y1="0" x2="0" y2="200"/>
      <line x1="40" y1="0" x2="40" y2="200"/>
      <line x1="80" y1="0" x2="80" y2="200"/>
      <line x1="120" y1="0" x2="120" y2="200"/>
      <line x1="160" y1="0" x2="160" y2="200"/>
      <line x1="200" y1="0" x2="200" y2="200"/>
      <line x1="240" y1="0" x2="240" y2="200"/>
      <line x1="280" y1="0" x2="280" y2="200"/>
      <line x1="320" y1="0" x2="320" y2="200"/>
    </g>
    <!-- Building mask region -->
    <rect x="160" y="80" width="80" height="80" fill="#888" opacity="0.6"/>
    <text x="200" y="125" class="lblc" fill="white" font-size="10">building mask</text>

    <!-- 5-point stencil -->
    <g transform="translate(80, 40)">
      <circle cx="0" cy="0" r="5" class="center"/>
      <circle cx="40" cy="0" r="5" class="stencil"/>
      <circle cx="-40" cy="0" r="5" class="stencil"/>
      <circle cx="0" cy="40" r="5" class="stencil"/>
      <circle cx="0" cy="-40" r="5" class="stencil"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#2a4d7a" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-40" y2="0" stroke="#2a4d7a" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#2a4d7a" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#2a4d7a" stroke-width="1.5"/>
      <text x="0" y="-50" class="lblc" font-size="9">i, j+1</text>
      <text x="50" y="3" class="lbl" font-size="9">i+1, j</text>
      <text x="0" y="58" class="lblc" font-size="9">i, j-1</text>
      <text x="-60" y="3" class="lbl" font-size="9">i-1, j</text>
      <text x="9" y="-6" class="lbl" font-size="9" font-weight="600">i, j</text>
    </g>

    <!-- Axis labels -->
    <text x="-10" y="100" class="lbl" transform="rotate(-90 -10 100)">z, Δz</text>
    <text x="160" y="220" class="lblc">x, Δx</text>
  </g>

  <!-- Equations panel -->
  <g transform="translate(420, 60)">
    <text x="0" y="0" class="eq" font-weight="600">Streamfunction–vorticity:</text>
    <text x="0" y="22" class="eq">∇²ψ = −ω</text>
    <text x="0" y="44" class="eq">(u·∇)ω = ν∇²ω + gβ ∂T/∂x</text>
    <text x="0" y="66" class="eq">(u·∇)T = α∇²T</text>
    <text x="0" y="98" class="eq" font-weight="600">Velocity from ψ:</text>
    <text x="0" y="118" class="eq">u = ∂ψ/∂z,  w = −∂ψ/∂x</text>
    <text x="0" y="150" class="eq" font-weight="600">Iteration:</text>
    <text x="0" y="170" class="eq">pseudo-time-step</text>
    <text x="0" y="186" class="eq">until ‖ΔT‖/‖T‖ &lt; 10⁻⁴</text>
  </g>
</svg>